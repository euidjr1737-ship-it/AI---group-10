 <!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    CHARACTER SHEET — TEAM 10
  </title>


  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="./style.css"
  >


  <style>

    .character-page {
      min-height: 100vh;

      padding:
        70px
        4.5vw
        120px;
    }


    .character-page-heading {
      max-width: 1380px;

      margin: 0 auto 75px;

      display: grid;

      grid-template-columns:
        1.1fr
        0.6fr;

      gap: 80px;

      align-items: end;
    }


    .character-kicker {
      display: block;

      margin-bottom: 21px;

      font-family:
        var(--font-en);

      font-size: 10px;

      font-weight: 600;

      letter-spacing: 0.13em;

      color:
        var(--clay-dark);
    }


    .character-page-heading h1 {
      margin: 0;

      font-family:
        var(--font-en);

      font-size:
        clamp(
          72px,
          9vw,
          138px
        );

      font-weight: 700;

      line-height: 0.8;

      letter-spacing:
        -0.075em;
    }


    .character-intro {
      max-width: 430px;

      margin: 0;

      padding-bottom: 5px;

      font-size: 13px;

      line-height: 1.95;

      color:
        var(--ink-soft);

      word-break:
        keep-all;
    }


    /* ===============================================
       GALLERY
    =============================================== */

    .character-gallery {
      max-width: 1380px;

      margin: 0 auto;

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 20px;
    }


    .character-card {
      overflow: hidden;

      border:
        1px solid
        var(--line);

      border-radius:
        21px 18px 23px 19px;

      background:
        #e6dbcf;

      transition:
        transform
        0.3s ease,
        box-shadow
        0.3s ease;
    }


    .character-card:hover {
      transform:
        translateY(-4px);

      box-shadow:
        0 18px 40px
        rgba(
          70,
          52,
          44,
          0.07
        );
    }


    .character-image {
      position: relative;

      overflow: hidden;

      aspect-ratio:
        16 / 10;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        radial-gradient(
          circle
          at 25% 20%,
          rgba(
            255,
            255,
            255,
            0.45
          ),
          transparent
          24%
        ),
        #ddd0c2;
    }


    .character-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      transition:
        transform
        0.5s
        cubic-bezier(
          .2,
          .8,
          .2,
          1
        );
    }


    .character-card:hover
    .character-image img {
      transform:
        scale(1.025);
    }


    .image-placeholder {
      position: absolute;

      inset: 0;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 8px;

      color:
        #96887e;
    }


    .image-placeholder span {
      font-family:
        var(--font-en);

      font-size: 10px;

      font-weight: 600;

      letter-spacing:
        0.12em;
    }


    .image-placeholder strong {
      font-family:
        var(--font-en);

      font-size: 18px;

      font-weight: 600;

      letter-spacing:
        -0.03em;
    }


    .character-caption {
      min-height: 78px;

      padding:
        17px
        20px;

      display: flex;

      align-items: center;

      justify-content:
        space-between;
    }


    .character-caption strong {
      font-family:
        var(--font-en);

      font-size: 13px;

      font-weight: 600;

      letter-spacing:
        -0.02em;
    }


    .character-caption span {
      font-family:
        var(--font-en);

      font-size: 9px;

      letter-spacing:
        0.09em;

      color:
        var(--ink-faint);
    }


    .back-home {
      max-width: 1380px;

      margin:
        65px
        auto
        0;

      padding-top:
        25px;

      border-top:
        1px solid
        var(--line);
    }


    .back-home a {
      font-family:
        var(--font-en);

      font-size: 12px;

      font-weight: 600;

      letter-spacing:
        0.02em;
    }


    @media
    (max-width: 800px) {

      .character-page-heading {
        grid-template-columns:
          1fr;

        gap: 40px;
      }


      .character-gallery {
        grid-template-columns:
          1fr;
      }

    }


    @media
    (max-width: 600px) {

      .character-page {
        padding:
          55px
          20px
          90px;
      }


      .character-page-heading h1 {
        font-size:
          17vw;
      }

    }

  </style>

</head>


<body>

  <div class="page-noise"></div>


  <!-- HEADER -->

  <header class="site-header">

    <a
      href="./index.html"
      class="brand"
    >

      <strong>
        TEAM 10
      </strong>

      <span>
        성균관대학교 영상학과 · AI기반영상제작워크샵
      </span>

    </a>


    <nav class="main-nav">

      <a href="./index.html#project">
        PROJECT
      </a>

      <a href="./index.html#archive">
        30 DAYS
      </a>

      <a href="./character.html">
        CHARACTER SHEET
        <span>↗</span>
      </a>

    </nav>

  </header>



  <main class="character-page">

    <section class="character-page-heading">

      <div>

        <span class="character-kicker">
          VISUAL DEVELOPMENT · 01—07
        </span>

        <h1>
          CHARACTER<br>
          SHEET
        </h1>

      </div>


      <p class="character-intro">

        프로젝트에 등장하는 캐릭터의 형태,
        표정, 의상과 시각적 특징을 정리한
        비주얼 아카이브입니다.

      </p>

    </section>



    <section
      class="character-gallery"
      id="characterGallery"
    ></section>


    <div class="back-home">

      <a href="./index.html">
        ← BACK TO PROJECT
      </a>

    </div>

  </main>



  <footer class="site-footer">

    <div>

      <strong>
        TEAM 10
      </strong>

      <span>
        성균관대학교 영상학과 · AI기반영상제작워크샵
      </span>

    </div>

    <span>
      CHARACTER ARCHIVE · 2026
    </span>

  </footer>



  <script>

    const gallery =
      document.getElementById(
        "characterGallery"
      );


    for (
      let i = 1;
      i <= 7;
      i++
    ) {

      const number =
        String(i).padStart(
          2,
          "0"
        );


      const card =
        document.createElement(
          "article"
        );


      card.className =
        "character-card";


      card.innerHTML = `

        <div class="character-image">

          <div
            class="image-placeholder"
          >

            <span>
              CHARACTER ARCHIVE
            </span>

            <strong>
              ${number}
            </strong>

          </div>


          <img
            src="./character-${number}.png"
            alt="Character ${number}"
          >

        </div>


        <div
          class="character-caption"
        >

          <strong>
            CHARACTER ${number}
          </strong>

          <span>
            CHARACTER SHEET
          </span>

        </div>

      `;


      const image =
        card.querySelector("img");


      const placeholder =
        card.querySelector(
          ".image-placeholder"
        );


      image.addEventListener(
        "load",
        () => {

          placeholder.style.display =
            "none";

        }
      );


      image.addEventListener(
        "error",
        () => {

          image.style.display =
            "none";

          placeholder.style.display =
            "flex";

        }
      );


      gallery.appendChild(card);

    }

  </script>

</body>
</html>
